name: Build and Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Specify the tag for the release'
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          # Full history and tags: the build stamps every binary from
          # git describe --tags, which reports nothing on a shallow clone.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/remote/package-lock.json

      - name: Use pinned npm
        run: npm install --global npm@12.0.2

      # Release binaries have always been UPX compressed, which roughly halves
      # what each app costs on the SD card. This used to come from the armv7
      # build container; the container is gone, so install it here. Release()
      # refuses to run without UPX_BIN rather than shipping larger binaries by
      # accident.
      - name: Install UPX
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y upx-ucl

      - name: Run mage prepRelease
        env:
          UPX_BIN: upx-ucl
        run: go run github.com/magefile/mage prepRelease

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" _bin/releases/* --clobber
          else
            gh release create "$TAG_NAME" _bin/releases/* --target "$GITHUB_SHA" --title "$TAG_NAME" --notes ""
          fi
