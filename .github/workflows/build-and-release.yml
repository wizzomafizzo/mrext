name: Build and Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Specify the tag for the release'
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build remote client
        run: |
          git clone --depth 1 https://github.com/wizzomafizzo/mrext-client.git /tmp/mrext-client
          npm ci --prefix /tmp/mrext-client
          npm run build --prefix /tmp/mrext-client
          rm -rf cmd/remote/_client/build
          mkdir -p cmd/remote/_client
          cp -a /tmp/mrext-client/build cmd/remote/_client/build

      - name: Run mage prepRelease
        run: go run github.com/magefile/mage prepRelease

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" _bin/releases/* --clobber
          else
            gh release create "$TAG_NAME" _bin/releases/* --target "$GITHUB_SHA" --title "$TAG_NAME" --notes ""
          fi
